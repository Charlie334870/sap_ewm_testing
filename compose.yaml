# Starts the whole platform on one machine:  docker compose up --build
# Settings come from the .env file next to this file (copy .env.example to .env first).
name: ewm-agent

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ewm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-ewm}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Reachable from this computer only, for the tests and for database tools.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ewm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ewm}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The API is only reachable through the web container, so its forwarded address is trusted.
      TRUST_PROXY: "true"
      # Encrypts SAP API keys. Without it only simulated systems can be registered.
      SECRETS_KEY: ${SECRETS_KEY:-}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-My Consulting Company}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      # Open http://localhost:3000 in the browser. Reachable from this computer only.
      - "127.0.0.1:3000:3000"

  # MCP server for Claude Desktop, for people who prefer Docker to Node.js. It is not started by
  # "docker compose up"; Claude Desktop starts it on demand (see docs/CONNECT-CLAUDE.md).
  mcp:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    stdin_open: true
    environment:
      EWM_API_URL: http://api:4000
      EWM_API_TOKEN: ${EWM_API_TOKEN:-}

volumes:
  db-data:
