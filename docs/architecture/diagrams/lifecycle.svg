<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#44546A"/>
    </marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#7F7F7F"/>
    </marker>
  </defs>
  <rect width="1500" height="560" fill="#FFFFFF"/>

  <text x="20" y="34" font-size="22" font-weight="bold" fill="#1F3864">Built in the MVP (Milestones 1 to 5)</text>

  <!-- Row 1 -->
  <g font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="20" y="56" width="190" height="84" rx="10" fill="#1F3864"/>
    <text x="115" y="92">Ticket</text><text x="115" y="118" font-size="16" font-weight="normal">created</text>

    <rect x="262" y="56" width="190" height="84" rx="10" fill="#2E75B6"/>
    <text x="357" y="92">Classify</text><text x="357" y="118" font-size="16" font-weight="normal">process · objects</text>

    <rect x="504" y="56" width="190" height="84" rx="10" fill="#2E75B6"/>
    <text x="599" y="92">Plan</text><text x="599" y="118" font-size="16" font-weight="normal">what to check</text>

    <rect x="746" y="40" width="440" height="190" rx="12" fill="#EADCF4" stroke="#7030A0" stroke-width="3"/>
    <text x="966" y="72" fill="#7030A0">Investigate (loop)</text>
    <rect x="766" y="90" width="120" height="60" rx="8" fill="#7030A0"/><text x="826" y="116" font-size="17">Select</text><text x="826" y="138" font-size="17">tool</text>
    <rect x="906" y="90" width="120" height="60" rx="8" fill="#7030A0"/><text x="966" y="116" font-size="17">Execute</text><text x="966" y="138" font-size="17">read-only</text>
    <rect x="1046" y="90" width="120" height="60" rx="8" fill="#7030A0"/><text x="1106" y="116" font-size="17">Record</text><text x="1106" y="138" font-size="17">evidence</text>
    <rect x="866" y="166" width="200" height="48" rx="8" fill="#7030A0"/><text x="966" y="197" font-size="17">Update hypotheses</text>

    <rect x="1240" y="56" width="240" height="84" rx="10" fill="#C55A11"/>
    <text x="1360" y="92">Root cause</text><text x="1360" y="118" font-size="16" font-weight="normal">must cite evidence</text>
  </g>
  <g stroke="#44546A" stroke-width="3">
    <line x1="210" y1="98" x2="256" y2="98" marker-end="url(#a)"/>
    <line x1="452" y1="98" x2="498" y2="98" marker-end="url(#a)"/>
    <line x1="694" y1="98" x2="740" y2="98" marker-end="url(#a)"/>
    <line x1="886" y1="120" x2="900" y2="120" marker-end="url(#a)"/>
    <line x1="1026" y1="120" x2="1040" y2="120" marker-end="url(#a)"/>
    <path d="M1106,150 L1106,190 L1072,190" fill="none" marker-end="url(#a)"/>
    <path d="M866,190 L826,190 L826,156" fill="none" marker-end="url(#a)"/>
    <line x1="1186" y1="98" x2="1234" y2="98" marker-end="url(#a)"/>
    <path d="M1360,140 L1360,286" fill="none" marker-end="url(#a)"/>
  </g>

  <!-- Row 2 (right to left) -->
  <g font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="1240" y="290" width="240" height="84" rx="10" fill="#C55A11"/>
    <text x="1360" y="326">Proposed solution</text><text x="1360" y="352" font-size="16" font-weight="normal">steps · rollback</text>

    <rect x="960" y="290" width="230" height="84" rx="10" fill="#C55A11"/>
    <text x="1075" y="326">Risk + test plan</text><text x="1075" y="352" font-size="16" font-weight="normal">impact · tests</text>

    <rect x="680" y="290" width="230" height="84" rx="10" fill="#548235"/>
    <text x="795" y="326">Human approval</text><text x="795" y="352" font-size="16" font-weight="normal">recorded, not executed</text>
  </g>
  <g stroke="#44546A" stroke-width="3">
    <line x1="1240" y1="332" x2="1196" y2="332" marker-end="url(#a)"/>
    <line x1="960" y1="332" x2="916" y2="332" marker-end="url(#a)"/>
  </g>

  <!-- Stop box -->
  <rect x="20" y="290" width="600" height="84" rx="10" fill="#FBE5D6" stroke="#C00000" stroke-width="3"/>
  <text x="320" y="322" text-anchor="middle" font-size="19" font-weight="bold" fill="#C00000">Stop rule at any step</text>
  <text x="320" y="350" text-anchor="middle" font-size="16" fill="#C00000">tool failure, unexpected data or budget reached: stop and report, never guess</text>

  <!-- Later -->
  <line x1="20" y1="412" x2="1480" y2="412" stroke="#7F7F7F" stroke-width="2" stroke-dasharray="12,8"/>
  <text x="20" y="446" font-size="22" font-weight="bold" fill="#595959">Later phases (need a real SAP system, not built in the MVP)</text>
  <g font-size="20" font-weight="bold" fill="#404040" text-anchor="middle">
    <rect x="20" y="464" width="250" height="74" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="10,7"/><text x="145" y="508">Execute in DEV</text>
    <rect x="322" y="464" width="250" height="74" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="10,7"/><text x="447" y="508">Test</text>
    <rect x="624" y="464" width="250" height="74" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="10,7"/><text x="749" y="508">Verify</text>
    <rect x="926" y="464" width="250" height="74" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="10,7"/><text x="1051" y="508">Document</text>
    <rect x="1228" y="464" width="252" height="74" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="3" stroke-dasharray="10,7"/><text x="1354" y="508">Close ticket</text>
  </g>
  <g stroke="#7F7F7F" stroke-width="3">
    <line x1="270" y1="501" x2="316" y2="501" marker-end="url(#g)"/>
    <line x1="572" y1="501" x2="618" y2="501" marker-end="url(#g)"/>
    <line x1="874" y1="501" x2="920" y2="501" marker-end="url(#g)"/>
    <line x1="1176" y1="501" x2="1222" y2="501" marker-end="url(#g)"/>
  </g>
</svg>
